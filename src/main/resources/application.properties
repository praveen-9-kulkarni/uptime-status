spring.application.name=uptime-status
uptime.probe-interval-ms=60000
uptime.history-prune-interval-ms=120000
uptime.history-keep-per-slug=20
spring.datasource.url=jdbc:postgresql://localhost:5432/uptime
spring.datasource.username=uptime
spring.datasource.password=uptime
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kubernetes-style probes (often already on; make it explicit)
management.endpoint.health.probes.enabled=true

# Liveness: do not tie restarts to DB/Redis
management.endpoint.health.group.liveness.include=livenessState

# Readiness: traffic / “can this app do its job?”
management.endpoint.health.group.readiness.include=readinessState,db,redis

# Local dev proof (tighten later if you add auth)
management.endpoint.health.show-details=always